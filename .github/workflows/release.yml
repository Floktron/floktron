name: release
# A version tag (v1.2.3) makes a GitHub Release whose text is that version's section of CHANGELOG.md.
on:
  push:
    tags: ["v*.*.*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest && pytest -q
      - name: Release notes from CHANGELOG.md
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '$0 ~ "^## "v" " {f=1; print; next} /^## / {f=0} f' CHANGELOG.md > notes.md
          test -s notes.md
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="FLOKTRON $(head -1 notes.md | sed 's/^## //')"
          gh release create "$GITHUB_REF_NAME" --title "$title" --notes-file notes.md --verify-tag
