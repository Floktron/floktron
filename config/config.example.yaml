# Copy to config.yaml and fill in. Never commit config.yaml.
company:
  name: "Example SIA"
  timezone: "Europe/Riga"
  language: "en"          # en | lv | ru | lt | et | de
  country: "LV"           # public holidays: LV | LT | EE (other = weekends only)
  holidays: []            # extra days off, e.g. ["2026-12-30"]

mail:
  provider: "gmail"       # proton_bridge | gmail | outlook | smtp
  user: ""                # login address of the mailbox
  from: ""                # sender shown to people (may be an alias); empty = user
  reply_to: ""            # where button replies go; empty = user
  smtp_host: ""           # only for provider "smtp"
  smtp_port: ""           # only for provider "smtp"
  imap_host: ""           # only for provider "smtp" (reading replies)
  imap_port: ""
  imap_folders: []        # empty = provider default (Proton: All Mail, Spam; Gmail/Outlook: INBOX, Junk)
  password_env: "FLOKTRON_MAIL_PASSWORD"   # password comes from this environment variable...
  keychain_service: ""                  # ...or from macOS Keychain (service name)
  manager_address: ""
  support_address: ""     # who sets FLOKTRON up and fixes it — gets the gaps report (empty = manager)
  retry_minutes: [10, 20] # mail server not answering → try again after 10, then 20 minutes
  marker: "FLOKTRON#"
  allow_any_sender: false # true = accept button replies from any address (not recommended)        # subject tag of FLOKTRON messages; change it to run a second FLOKTRON in the same mailbox

colors:                    # message colours (company brand); remove to use the defaults
  main: "#1A365D"          # header, question button
  ok: "#4A9928"            # done / accept buttons
  neutral: "#717171"       # not done / small text
  background: "#f3f3f3"

storage:
  root: "~/Cloud/FLOKTRON"   # iCloud / Google Drive / OneDrive folder

rays:                      # departments; add or remove freely
  - id: L1
    name: "Sales"
    lead: ""
    email: ""
    lead_email: ""        # team lead — gets escalations of this ray
    send_at: "07:40"
  - id: L2
    name: "Stock"
    lead: ""
    send_at: "07:40"

schedule:                  # automatic runs (scripts/install/…); weekends and holidays are skipped
  morning: "07:40"
  deadline: "09:00"        # who did not answer at all
  evening: "18:30"         # reminder for today's open tasks
  news: "18:56"
  content: "07:12"         # every day: posts of the day, missed posts, duplicates
  summary: "Fri 16:00"     # weekly summary to the manager
  gaps: "Fri 16:10"        # weekly list of what FLOKTRON could not do
  registry: "Mon 07:00"    # new companies in the registry
  # supply: "19:10"        # optional: supply chain watch every day (docs/SUPPLY_CHAIN.md)
  # supply_week: "Mon 19:20" # optional: weekly full run (news 7 days + supplier page changes)
  collect_every_minutes: 30

escalation:
  reply_deadline: "09:00"   # run collect_replies.py --deadline at this time
  chain: ["ray", "team_lead", "manager"]

radar:
  languages: ["en", "lv"]  # one keyword column per language in data/floktron_radar.xlsx
  countries: ["LV", "LT", "EE"]
  news_slice_at: "18:56"   # evening news slice (after the main evening news)
  weekly_at: "Mon 07:15"   # weekly monitoring
  fact_check:              # light fact-check of news used for posts (prompts/31_news_check.md); edit freely
    - "https://rebaltica.lv/category/recheck/"          # LV — Re:Baltica Re:Check
    - "https://www.delfi.lv/news/temas/melu-detektors"  # LV — Delfi Melu detektors
    - "https://edmo.eu"                                 # EU — European Digital Media Observatory
    - "https://toolbox.google.com/factcheck/explorer"   # world — Google Fact Check Explorer
  correction_words: ["atsaukums", "labojums", "precizējums", "correction", "retraction", "clarification",
                     "Berichtigung", "Richtigstellung", "опровержение", "поправка", "patikslinimas", "parandus"]

calendar:                  # optional: your calendar in the morning message + due dates as .ics (docs/CALENDAR.md)
  enabled: false
  url_env: "FLOKTRON_CAL_URL"      # the private read-only .ics link comes from this environment variable...
  keychain_service: "FLOKTRON_CAL" # ...or from macOS Keychain (scripts/install/calendar_link.command saves it here)
  timezone: "Europe/Riga"
  rays: []                         # whose morning message shows "Today in your calendar", e.g. ["L1"]
  busy_only: false                 # true → only "10:00–11:00 busy", no titles or places
  attach_due: true                 # every morning message gets an .ics with the due dates of its tasks

content:                   # optional content plan (data/floktron_content.xlsx, prompts/40_content_plan.md)
  notify: ""               # who gets the posts of the day; empty → mail.manager_address
  links_file: "data/published_links.txt"   # paste links of published posts here (one per line)
  profiles:                # public pages the AI agent may READ to confirm a post went out (prompts/41_published_check.md)
    # Facebook: "https://www.facebook.com/yourpage"
    # LinkedIn: "https://www.linkedin.com/company/yourcompany/posts/"
    # LinkedIn personal: "https://www.linkedin.com/in/yourname/recent-activity/all/"   # posts and reposts made as a person
    # X: "https://x.com/yourname"
    # X scheduled: "https://x.com/compose/post/unsent/scheduled"                     # only if you are signed in
    # TikTok: "https://www.tiktok.com/@yourname"
    # YouTube: "https://www.youtube.com/@yourname/videos"
    # Instagram: "https://www.instagram.com/yourname/"

supply_chain:              # optional: watch list is the sheet Watchlist in data/floktron_radar.xlsx (docs/SUPPLY_CHAIN.md)
  yellow_pct: 5            # default alarm for a 5-day move, % (a row's own Yellow % / Red % wins)
  red_pct: 10

invoices:                  # optional: supplier invoices → accounting (docs/INVOICES.md, prompts/50_invoices.md)
  our_iban: ""             # your company account as printed in bank statements, e.g. LV00BANK0000000000000
  our_vat: ""              # your VAT number; its country is "home" for the VAT check
  ray: L7                  # who gets the tasks (finance)

snapshot:                  # optional: company snapshot → PDF + JSON (docs/SNAPSHOT.md, prompts/51_snapshot.md)
  facts: data/snapshot/facts.json
  out: data/snapshot/out
  locked_words: []         # words that must never leave the company, e.g. ["our secret ingredient"]

documents:                 # optional: branded invoices, advance invoices, acts, offers (docs/DOCUMENTS.md, prompts/52_documents.md)
  legal_name: ""           # as in the register; empty = company.name
  reg_no: ""
  vat_no: ""
  address: ""
  email: ""                # public company address
  phone: ""
  web: ""
  bank: ""
  swift: ""
  iban: ""
  prefix: "INV"            # numbers: INV-R-2026-001 (R invoice, AR advance, A act, P offer)
  logo: ""                 # PNG, transparent background; next to config.yaml or a full path

followups:                 # optional: polite reminders after an offer, only after your OK (docs/FOLLOWUPS.md)
  enabled: false
  days: [3, 7, 14]         # after the offer was sent
  hours: "08-20"           # Monday to Friday only
  approve_by: ""           # who presses ✅ (empty = mail.manager_address)
  signature: ""            # under the reminder (empty = company name, phone, e-mail)
  imap_folders: []         # folders with sent AND received mail (empty = provider default "All Mail")
  free_mail_domains: []    # more domains that are not one company (gmail.com etc. are built in)

mail_watch:                # optional: the whole mailbox in one sheet + a nudge when someone waits for you (docs/MAIL_WATCH.md)
  enabled: false
  notify: telegram         # telegram (bot below → manager_chat_ids) | mail (to mail.manager_address) | none
  notify_subjects: true    # false = the notice shows who and what is needed, not the subject
  quiet_hours: "22-07"     # nothing is sent in these hours; it waits for the morning
  important: {}            # organisations whose invitations and portal notices always count, e.g. {vid.gov.lv: "State Revenue Service"}
  own_addresses: []        # more addresses of yours (aliases)
  inbox_folders: []        # empty = provider default (INBOX)
  sent_folders: []         # empty = provider default (Proton "Sent", Gmail "[Gmail]/Sent Mail", Outlook "Sent Items")
  first_days: 30           # first run reads 30 days back, later runs `days`
  days: 4

gateways:                  # optional: every card payment finds its document — Stripe, Paddle, Apple, Google … (docs/GATEWAYS.md)
  enabled: false
  notify: telegram         # telegram | mail | none
  quiet_hours: "22-07"
  card_days: 120           # card payments of the last N days are checked
  act_days: 30             # no document after N days → draft internal act for the head to sign
  folders: []              # empty = INBOX + the provider's spam folder
  first_days: 30
  days: 4

prospects:                 # optional: new customers like your best ones, with a reason to write now (docs/PROSPECTS.md)
  enabled: false
  notify: telegram         # telegram | mail | none — a short message when there are new prospects
  best_customers: []       # reg. numbers of your best customers — their form, town and age make the portrait
  home_area: []            # town words that count as near; empty = the towns of your best customers
  days: 180                # contracts signed in the last N days
  min_eur: 10000
  max_new: 40
  pitch: ""                # two sentences for the draft letter, from your own fact sheet
  product_line: ""         # subject line of the draft
  letter: ""               # optional template file ({company} {works} {pitch} {product_line} {signature})
  signals:                 # kind of work by words (stems) in the contract subject — tune them for your trade; first match wins
    - {name: networks, weight: 1, words: ["ūdensapgād", "kanalizāc", "ielas", "ceļa", "tilta"], unless: ["flīz", "sanmezgl", "iekšdarb", "apdar", "ēkas"]}
    - {name: finishing, weight: 3, words: ["flīz", "apdar", "iekšdarb", "remont", "sanmezgl", "grīd", "apmet", "betona", "fasād"]}
    - {name: building, weight: 2, words: ["būvdarb", "būvniecīb", "pārbūv", "rekonstrukc", "izbūv", "atjaunoš", "jumta", "ēkas"]}
  exclude_words: ["projektēš", "būvprojekt", "būvuzraudz", "autoruzraudz", "ekspertīz", "konsultāc", "piegāde", "noma"]

telegram:                  # optional bot: dialog → leads (scripts/bot/telegram_bot.py); off until a token exists
  enabled: false
  token_env: "FLOKTRON_TG_TOKEN"   # bot token from @BotFather comes from this environment variable...
  keychain_service: "FLOKTRON_TG_BOT"  # ...or from macOS Keychain (scripts/install/telegram/1_token.command saves it here)
  flow: "bot_flow.yaml"         # the dialog, next to this config (copy config/bot_flow.example.yaml)
  manager_chat_ids: []          # who gets new leads and may use /leads /funnel — write /id to the bot to see yours
  data_dir: ""                  # empty = data/ of FLOKTRON; relative paths start at this config file
  leads_file: ""                # empty = <data_dir>/floktron_leads.xlsx
  channels_file: "channels.txt" # channel watch: one public channel per line; forward a post to the bot to add one
  keywords_file: ""             # one keyword per line — or keywords_xlsx + keywords_sheet + keywords_columns + keywords_priority
  watch_times: []               # e.g. ["07:05", "18:40"] — the bot checks the channels at these times
  voice:                        # optional: voice reports + audio summary (docs/VOICE.md); local by default
    enabled: false
    users: {}                   # chat id: "L5 Logistics" — who may send voice reports
    accept_unknown: false
    max_seconds: 300
    stt_engine: auto            # auto = local faster-whisper; or elevenlabs (your key)
    stt_model: small
    stt_lang:                   # empty = detect
    pulse_dir: "../data/audio"  # the morning run writes pulse_<date>.txt here; the bot reads it aloud
    tts_engine: auto            # auto = system voice; or elevenlabs
    tts_lang: en

site_module:
  enabled: false
  bot: "telegram"          # telegram | whatsapp
